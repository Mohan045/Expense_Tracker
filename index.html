<!DOCTYPE html>
<html>
<head>
  <title>Fruit Shop</title>
</head>
<body>

  <h1>Fruit Shop</h1>

  <!-- ── Add Fruit Form ───────────────────────────────── -->
  <h2 id="form-heading">Add Fruit</h2>

  Name:     <input type="text"   id="name"    /> <br/><br/>
  Price:    <input type="number" id="price"   /> <br/><br/>
  Quantity: <input type="number" id="quantity"/> <br/><br/>

  <button onclick="saveFruit()">Save</button>
  <button onclick="cancelEdit()" id="cancel-btn" style="display:none">Cancel</button>

  <p id="message"></p>

  <hr/>

  <!-- ── Fruits Table ─────────────────────────────────── -->
  <h2>All Fruits</h2>
  <table border="1" cellpadding="8">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price (Rs)</th>
      <th>Quantity</th>
      <th>Edit</th>
      <th>Delete</th>
    </tr>
    <tbody id="fruit-table">
      <tr><td colspan="6">Loading...</td></tr>
    </tbody>
  </table>

  <script src="/script.js"></script>

</body>
</html>
