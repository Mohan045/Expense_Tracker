<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Book</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

  <!-- ── Top Header ─────────────────────────────────── -->
  <div class="header">
    <h1>📒 Contact Book</h1>
    <p>Add, edit and delete your contacts easily</p>
  </div>

  <div class="page">

    <!-- ── Left: Add / Edit Form ──────────────────────── -->
    <div class="form-box">
      <h2 id="form-title">➕ Add New Contact</h2>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="f-name" placeholder="e.g. Mohan Kumar"/>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="f-phone" placeholder="e.g. 9876543210"/>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="text" id="f-email" placeholder="e.g. mohan@email.com"/>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select id="f-category">
          <option value="">Select category</option>
          <option value="Friend">Friend</option>
          <option value="Family">Family</option>
          <option value="Work">Work</option>
        </select>
      </div>

      <!-- Error message -->
      <div class="error-msg" id="error-msg"></div>

      <!-- Buttons -->
      <div class="form-buttons">
        <button class="btn-save"   id="btn-save"   onclick="saveContact()">💾 Save Contact</button>
        <button class="btn-cancel" id="btn-cancel" onclick="cancelEdit()" style="display:none">✖ Cancel</button>
      </div>
    </div>

    <!-- ── Right: Contacts List ────────────────────────── -->
    <div class="list-box">

      <!-- Search bar -->
      <div class="search-bar">
        <input type="text" id="search" placeholder="🔍  Search by name..." oninput="searchContacts()"/>
      </div>

      <!-- Contact cards go here -->
      <div id="contacts-list">
        <p class="loading">Loading contacts...</p>
      </div>

    </div>

  </div>

  <!-- Toast message -->
  <div class="toast" id="toast"></div>

  <script src="/script.js"></script>
</body>
</html>
